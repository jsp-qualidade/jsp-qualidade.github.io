<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--sunk:#EEF1F5;--ink:#14212E;--ink2:#334455;--muted:#66768A;--line:#D9E0E8;--line2:#E8EDF2;
  --nav:#0F2A44;--nav2:#173A5C;--navtxt:#C9D6E4;
  --brand:#0B5CAD;--brand2:#0A4E93;--brand-soft:#E6F0FB;
  --ok:#17804F;--ok-soft:#E3F4EB;--nc:#C0392B;--nc-soft:#FBE7E4;--warn:#A86B00;--warn-soft:#FFF4DC;--info:#5B4BB7;--info-soft:#EEEBFA;
  --r:10px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #F0B429;outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:650}
h2{font-size:17px;font-weight:650}
h3{font-size:14.5px;font-weight:650}
p{margin:0}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* navegação */
.side{background:var(--nav);color:var(--navtxt);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--nav2);margin-bottom:10px}
.logo .mk{width:36px;height:36px;border-radius:8px;background:#fff;color:var(--nav);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.logo b{color:#fff;font-size:14px;display:block}
.logo small{font-size:11px;color:var(--navtxt)}
.navbtn{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--navtxt);text-align:left;padding:9px 10px;border-radius:7px;font-size:13.5px;width:100%}
.navbtn:hover{background:var(--nav2);color:#fff}
.navbtn.active{background:var(--brand);color:#fff;font-weight:600}
.navbtn svg{flex:none;width:17px;height:17px}
.navsep{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#7F96AE;padding:14px 10px 4px}
.side .foot{margin-top:auto;font-size:11px;color:#8BA2BA;padding:10px 8px 0;border-top:1px solid var(--nav2);line-height:1.5}
.dbdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3BB273;margin-right:6px}
.dbdot.warn{background:#F0B429}
/* conteúdo */
.main{min-width:0}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.top .crumb{font-size:12px;color:var(--muted)}
.top .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.page{padding:22px 28px 48px;max-width:1500px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px;max-width:820px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:14px}
.card h2{margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.sticky{position:sticky;top:76px}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;font-size:13px;font-weight:550;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2);color:#fff}
.btn.danger{color:var(--nc);border-color:#EBC4BF}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
label.f .req{color:var(--nc)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);margin-top:4px;font-size:13.5px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.pill{display:inline-block;font-size:11px;font-weight:650;border-radius:20px;padding:2px 9px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.nc{background:var(--nc-soft);color:var(--nc)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .v{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{background:var(--sunk);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#F7FAFD}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:70vh}
.empty{padding:36px;text-align:center;color:var(--muted)}
.banner{border-radius:8px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:#F2D9A6;color:#6B4800}
.banner.info{background:var(--brand-soft);border-color:#BFD6F1;color:#123E6B}
.banner.nc{background:var(--nc-soft);border-color:#F0C3BD;color:#7A1F14}
.banner.ok{background:var(--ok-soft);border-color:#B7DEC8;color:#0E5133}
/* plano */
.plan{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.plan .ph{background:var(--nav);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.plan .ph b{font-size:14px}
.plan .pb{padding:16px}
.bigs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
.bigs div{background:var(--sunk);border-radius:8px;padding:10px 6px;text-align:center}
.bigs .v{font-size:24px;font-weight:750;line-height:1.1}
.bigs .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:650}
.trace{font-size:12px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:10px 12px;line-height:1.6}
.trace b{color:var(--ink)}
.verdict{border-radius:9px;padding:14px 16px;margin-top:12px;font-weight:650;display:flex;gap:12px;align-items:center}
.verdict .big{font-size:20px;font-weight:800;letter-spacing:.3px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.nc{background:var(--nc-soft);color:var(--nc)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.wait{background:var(--sunk);color:var(--muted)}
/* contadores de defeito */
.defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.defc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface)}
.defc.has{border-color:#E8A79F;background:#FFF8F7}
.defc .n{font-size:13px;line-height:1.3}
.defc small{display:block;color:var(--muted);font-size:11px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:30px;height:30px;font-size:16px;font-weight:700}
.stepper input{width:46px;border:0;margin:0;text-align:center;padding:4px;border-radius:0}
/* segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-left:1px solid var(--line);background:none;padding:6px 12px;font-size:12.5px;font-weight:550}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.seg.yn button[aria-pressed=true][data-v=S]{background:var(--nc);color:#fff}
.seg.yn button[aria-pressed=true][data-v=N]{background:var(--ok);color:#fff}
.seg.yn button[aria-pressed=true][data-v=X]{background:var(--muted);color:#fff}
/* investigação */
.stagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--sunk);border-radius:8px;margin:14px 0 8px}
.stagehead.off{opacity:.55}
.cause{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:8px;background:var(--surface)}
.cause.S{border-color:#E8A79F;box-shadow:inset 4px 0 0 var(--nc)}
.cause.N{opacity:.7;box-shadow:inset 4px 0 0 var(--ok)}
.cause.off{opacity:.5}
.cause .top2{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cause ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.cause .mech{font-size:12.5px;color:var(--ink2);margin-top:6px}
.cause details{margin-top:8px;font-size:12.5px}
.cause summary{cursor:pointer;color:var(--brand);font-weight:600}
.treebox{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#FBFCFE}
.treebox svg{display:block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13px}
.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
.bar{height:10px;border-radius:5px;background:var(--brand)}
.barrow{display:grid;grid-template-columns:200px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12.5px;margin-bottom:6px}
.barrow .track{background:var(--sunk);border-radius:5px;overflow:hidden}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:3px;display:inline-block}
.list-kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13px}
.list-kv dt{color:var(--muted)}
.list-kv dd{margin:0;font-weight:550}
dialog{border:1px solid var(--line);border-radius:12px;padding:22px;width:min(640px,94vw);color:var(--ink)}
dialog::backdrop{background:rgba(15,42,68,.45)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--nav);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50;opacity:0;transform:translateY(8px);transition:.2s}
.toast.on{opacity:1;transform:none}
.toast{pointer-events:none;z-index:40}
body.hasbar .toast{bottom:88px}
.demo-tag{background:#FFE8A3;color:#6B4800;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;letter-spacing:.4px}
.sec-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:0 0 8px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line2)}
.chk input{width:auto;margin:3px 0 0}
.t1 td,.t1 th{text-align:center!important;padding:6px 8px!important}
.t1 td.hl{background:var(--brand);color:#fff;font-weight:700;border-radius:4px}
.printonly{display:none}

<script>
/* =========================================================================
   1. NBR 5426 — PLANOS DE AMOSTRAGEM POR ATRIBUTOS (amostragem simples)
   Tabelas 1, 2 (normal), 3 (severa), 4 (atenuada) e 17 codificadas a partir da norma.
   ========================================================================= */
const NQA=["0,010","0,015","0,025","0,040","0,065","0,10","0,15","0,25","0,40","0,65","1,0","1,5","2,5","4,0","6,5","10","15","25","40","65","100","150","250","400","650","1000"];
// Inspeção por peças não conformes (porcentagem defeituosa): a NBR 5426 só admite NQA de 0,010 a 10 nesse caso.
// Os NQA de 15 a 1000 valem apenas para "falhas por 100 unidades" e não são usados neste sistema.
const NQA_P=NQA.slice(0,16);
const LET="ABCDEFGHJKLMNPQRS".split("");             // índices 0..16 (S só na severa)
const N_NS=[2,3,5,8,13,20,32,50,80,125,200,315,500,800,1250,2000,3150];
const N_AT=[2,2,2,3,5,8,13,20,32,50,80,125,200,315,500,800];
const LEVELS=["S1","S2","S3","S4","I","II","III"];
const T1_RANGES=[[2,8],[9,15],[16,25],[26,50],[51,90],[91,150],[151,280],[281,500],[501,1200],[1201,3200],[3201,10000],[10001,35000],[35001,150000],[150001,500000],[500001,Infinity]];
const T1={S1:"AAAABBBBCCCCDDD",S2:"AAABBBCCCDDDEEE",S3:"AABBCCDDEEFFGGH",S4:"AABCCDEEFGGHJJK",I:"AABCCDEFGHJKLMN",II:"ABCDEFGHJKLMNPQ",III:"BCDEFGHJKLMNPQR"};
const P_N=[[1,2],[2,3],[3,4],[5,6],[7,8],[10,11],[14,15],[21,22],[30,31],[44,45]];
const P_T=[[1,2],[2,3],[3,4],[5,6],[8,9],[12,13],[18,19],[27,28],[41,42]];
const P_R=[[0,2],[1,3],[1,4],[2,5],[3,6],[5,8],[7,10],[10,13],[14,17],[21,24]];
const P_RB=[[0,2],[1,3],[2,4],[3,5],[5,6],[7,8],[10,11],[14,15],[21,22],[30,31]];
const REG={N:"Normal",T:"Severa",R:"Atenuada"};
const REG_T={N:"Tabela 2",T:"Tabela 3",R:"Tabela 4"};

function t1Row(N){return T1_RANGES.findIndex(([a,b])=>N>=a&&N<=b)}
function codeLetter(N,level){const r=t1Row(N);if(r<0)return null;return T1[level][r]}
// célula das Tabelas 2–4: [Ac,Re] ou "D" (seta para baixo) / "U" (seta para cima)
function cell(reg,i,j){
  const d=i+j;
  if(reg==="T"){
    if(i>16)return null;
    if(d<15)return "D";
    if(d===15)return i===0?"D":[0,1];
    if(d===16)return i===15?"U":"D";
    if(d===17)return "D";
    const k=d-18,cap=i<=4?8:6;return k>cap?"U":P_T[k];
  }
  if(i>15)return null;
  if(d<14)return "D";
  if(d===14)return [0,1];
  if(d===15)return i===0?"D":"U";
  if(d===16)return i===15?"U":"D";
  const k=d-17;
  if(reg==="R"){
    if(i===0)return k>8?"U":P_N[k];
    if(i===1)return k>9?"U":P_RB[k];
    const cap=i<=4?9:7;return k>cap?"U":P_R[k];
  }
  const cap=i<=4?9:7;return k>cap?"U":P_N[k];
}
function samplingPlan(N,level,nqaIdx,reg){
  N=+N;if(!N||N<1||nqaIdx==null||nqaIdx<0)return null;
  if(N<2)return {full:true,n:N,ac:0,re:1,letter0:"—",letter:"—",i0:-1,i:-1,arrow:false,reg};
  const L0=codeLetter(N,level);let i=LET.indexOf(L0);const i0=i;let c,guard=0;
  while(guard++<40){c=cell(reg,i,nqaIdx);if(c==="D")i++;else if(c==="U")i--;else break}
  if(!Array.isArray(c))return null;
  let n=reg==="R"?N_AT[i]:N_NS[i];const full=n>=N;if(full)n=N;
  return {letter0:L0,letter:LET[i],i0,i,n,ac:c[0],re:c[1],arrow:i!==i0,full,reg};

function tx(store,mode,fn){return new Promise((res,rej)=>{if(!idb){res(null);return}const t=idb.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:true);t.onerror=()=>rej(t.error)})}

  if(cloudState==="ok"&&sb){try{const {count,error}=await sb.from(t).select("id",{count:"exact",head:true});if(error)throw error;return !count}catch(e){return false}}

async function putLocal(store,obj){const arr=S[store],i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);if(idb)await tx(store,"readwrite",st=>st.put(obj));else saveLS()}
async function delLocal(store,id){S[store]=S[store].filter(x=>x.id!==id);if(idb)await tx(store,"readwrite",st=>st.delete(id));else saveLS()}
async function persist(store,obj){
  obj.updatedAt=Date.now();if(user)obj.updatedBy=user.email;await putLocal(store,obj);
  if(cloudState==="ok"&&!obj.demo)await pushRow(store,obj.id,false);else if(cloudConfigured()&&!localMode()&&!obj.demo)await enqueue(store,obj.id,false);
  updateDbStatus();
}
async function remove(store,id,info){
  const was=S[store].find(x=>x.id===id);const keep=was?{...was,...(info||{}),excluidoEm:new Date().toISOString(),excluidoPor:user?.email||""}:null;await delLocal(store,id);
  if(was&&!was.demo){if(cloudState==="ok")await pushRow(store,id,true,keep);else if(cloudConfigured()&&!localMode())await enqueue(store,id,true,keep)}
  updateDbStatus();
}

const isPermErr=e=>!!e&&(e.code==="42501"||e.code==="PGRST301"||e.status===401||e.status===403||/row-level security|permission denied|JWT/i.test(e.message||""));
let _permWarn=0;
async function onPermErr(){ // o banco recusou a gravação: confere se o acesso foi bloqueado ou se a sessão venceu
  if(Date.now()-_permWarn<15000)return;_permWarn=Date.now();
  const st=await recheckAccess();
  if(st==="ok")toast("O banco recusou uma alteração por falta de permissão. Ela fica guardada neste aparelho; avise o administrador.");
}
async function pushRow(store,id,del,keep){
  const obj=del?(keep||{}):S[store].find(x=>x.id===id);
  try{const {error}=await sb.from(store).upsert({id,dados:obj,excluido:!!del,atualizado_por:user.email});if(error)throw error;return true}
  catch(e){await enqueue(store,id,del,keep);
    if(isPermErr(e)){onPermErr();return false}
    setCloud("offline","Sem conexão com o banco: as alterações ficam guardadas neste aparelho e serão enviadas automaticamente.");return false}
}
// Confere de tempos em tempos se o usuário continua autorizado (bloqueio, exclusão ou troca de papel)
async function recheckAccess(){
  if(!sb||!user||localMode())return "ok";
  try{const {data,error}=await sb.from("colaboradores").select("email,nome,papel,ativo").eq("email",(user.email||"").toLowerCase()).maybeSingle();if(error)throw error;
    if(!data||!data.ativo){colab=null;colabStatus=data?"bloqueado":"pendente";setCloud("negado");draft=null;render();return "negado"}
    const mudou=colab&&colab.papel!==data.papel;colab=data;if(mudou){await loadPendentes();render()}return "ok";
  }catch(e){return "erro"}
}
async function enqueue(store,id,del,keep){const f=(S.meta.fila||[]).filter(q=>!(q.store===store&&q.id===id));f.push({store,id,del,keep:del?(keep||null):null});await setMeta("fila",f)}
async function flushQueue(){const f=[...(S.meta.fila||[])];if(!f.length||!sb||!user)return;const rest=[];
  let perm=false;
  for(const q of f){const obj=S[q.store].find(x=>x.id===q.id);
    if(!q.del&&!obj)continue; // registro já não existe neste aparelho: nada a enviar
    try{const {error}=await sb.from(q.store).upsert({id:q.id,dados:q.del?(q.keep||{}):obj,excluido:!!q.del,atualizado_por:user.email});if(error)throw error}catch(e){rest.push(q);if(isPermErr(e))perm=true}}
  await setMeta("fila",rest);if(perm)onPermErr();updateDbStatus();
}
// Lê uma consulta inteira em páginas (o banco devolve no máximo 1.000 linhas por pedido)
async function fetchAll(build){const out=[],PG=1000;for(let from=0;;from+=PG){const {data,error}=await build().range(from,from+PG-1);if(error)throw error;out.push(...(data||[]));if(!data||data.length<PG)break}return out}
async function pullCloud(full){
  if(!sb||cloudState!=="ok"&&cloudState!=="offline")return;
  if(pullCloud._busy)return;pullCloud._busy=true;
  try{
    let maxT=full?null:S.meta.lastPull||null;
    // volta 2 minutos no incremental para não perder gravações simultâneas de outros aparelhos
    const since=maxT?new Date(new Date(maxT).getTime()-120000).toISOString():null;let mudou=false;
    for(const t of TABLES){
      const rows=await fetchAll(()=>{let q=sb.from(t).select("id,dados,excluido,atualizado_em").order("atualizado_em",{ascending:true}).order("id",{ascending:true});if(since)q=q.gt("atualizado_em",since);return q});
      for(const r of rows){if(!maxT||r.atualizado_em>maxT)maxT=r.atualizado_em;
        if(r.excluido){if(S[t].some(x=>x.id===r.id)){await delLocal(t,r.id);mudou=true}continue}
        if(!r.dados||typeof r.dados!=="object"||!r.dados.id)continue;
        if((S.meta.fila||[]).some(q=>q.store===t&&q.id===r.id))continue; // há alteração local ainda não enviada
        const cur=S[t].find(x=>x.id===r.id);if(!cur||(r.dados.updatedAt||0)>(cur.updatedAt||0)){await putLocal(t,r.dados);mudou=true}}
    }

   ========================================================================= */
const seriesKey=r=>[r.productId,r.ponto,r.nqa].join("|");
const byTime=(a,b)=>(a.data||"").localeCompare(b.data||"")||(a.createdAt-b.createdAt);
// comDemo: true = conta lotes DEMO; false = ignora; sem valor = conta só se a série não tiver lote real
function regimeState(productId,ponto,nqa,excludeId,comDemo,antesDe){
  const key=[productId,ponto,nqa].join("|");
  let lots=S.inspecoes.filter(x=>seriesKey(x)===key&&!x.reap&&x.result&&x.id!==excludeId).sort(byTime);
  if(comDemo===false||(comDemo==null&&lots.some(x=>!x.demo)))lots=lots.filter(x=>!x.demo);
  if(antesDe)lots=lots.filter(x=>byTime(x,antesDe)<0);
  let reg="N",reason="Início da inspeção em regime normal (5.2.1).",win=[],nRun=[],tAcc=0,tCount=0;
  for(const x of lots){
    const used=x.regime||"N";reg=used;
    if(used==="N"){
      win.push(x.result==="R");if(win.length>5)win.shift();
      if(x.result==="R")nRun=[];else nRun.push(x);
      if(win.filter(Boolean).length>=2){reg="T";reason="2 lotes rejeitados em 5 consecutivos: passar para severa (5.3.1).";win=[];nRun=[];tAcc=0;tCount=0;continue}
      reason=`Regime normal. ${win.filter(Boolean).length} rejeição(ões) nos últimos ${win.length} lote(s).`;
    }else if(used==="T"){
      tCount++;tAcc=x.result==="R"?0:tAcc+1;
      if(tAcc>=5){reg="N";reason="5 lotes consecutivos aceitos em severa: voltar ao normal (5.3.2).";tAcc=0;tCount=0;win=[];nRun=[];continue}
      reason=`Regime severo. ${tAcc} de 5 lotes consecutivos aceitos para voltar ao normal.`;
    }else if(used==="R"){
      if(x.result==="R"||x.result==="AR"||x.irregular){reg="N";reason=x.result==="R"?"Lote rejeitado em atenuada: voltar ao normal (5.3.4.1).":x.result==="AR"?"Lote aceito com defeitos entre Ac e Re em atenuada: voltar ao normal (5.3.4.2).":"Produção irregular: voltar ao normal (5.3.4.3).";win=[];nRun=[];continue}
      reason="Regime atenuado mantido.";
    }
  }
  let eligibleR=null;
  if(reg==="N"&&nRun.length>=10){
    const last=nRun.slice(-10),sumN=last.reduce((a,x)=>a+x.n,0),sumD=last.reduce((a,x)=>a+x.d,0),lim=t17Limit(sumN,+nqa);
    eligibleR={sumN,sumD,lim,ok:lim!=null&&sumD<=lim};
  }
  return {reg,reason,eligibleR,interrupt:reg==="T"&&tCount>=10,tCount,lots:lots.length};
}

function presenceQs(v){
  const q=[];
  if(v.ponto==="FL")q.push({id:"fl",t:"A peça já chegou ao Final de Linha com o defeito (antes da rebarbação e do manuseio)?",yes:"Origem antes do Final de Linha",no:"Origem no Final de Linha",ev:"Peças do mesmo rack ainda não rebarbadas; etiqueta do rack"});
  if(v.ponto==="FL"||v.ponto==="EST")q.push({id:"est",t:"O defeito já era visível na desmoldagem, antes da estufa?",yes:"Origem na moldagem (ou antes)",no:"Origem na estufa",ev:"Formulário A / FS 070 da moldagem no período; peças retidas da OP"});
  return q;
}
function origin(v){
  if(v.ponto==="MOLD")return "MOLD";
  const p=v.presenca||{};
  if(v.ponto==="FL"){if(p.fl==="N")return "FL";if(p.fl!=="S")return null}
  if(p.est==="N")return "EST";if(p.est==="S")return "MOLD";return null;

// grava uma causa (nova, alterada, removida ou restaurada) com histórico de quem mexeu
async function saveCause(c,acao){
  const rec={};["id","st","nome","defs","mech","evid","nat","fonte","acao","resp","efic","reacao","removida"].forEach(k=>{if(c[k]!==undefined)rec[k]=c[k]});
  rec.removida=!!c.removida;rec.hist=[...((S.causas.find(x=>x.id===c.id)||{}).hist||[]),{em:new Date().toISOString(),por:user?.email||"modo local",acao}].slice(-20);
  await persist("causas",rec);rebuildCauses();
}
function pgCausa(){

  head("Biblioteca",isNew?"Nova causa":"Editar causa",isNew?"":`${orig._mod?'<button class="btn" id="cOrig">Voltar ao texto original</button>':""}<button class="btn danger" id="cDel">Remover causa</button>`);

    <label class="f" style="margin-top:12px">Como essa causa gera o defeito (mecanismo)<textarea id="c_mech" placeholder="Explique em uma ou duas frases, como você explicaria a um operador novo.">${esc(C.mech)}</textarea></label>

    ${(()=>{const fora=DEFECTS.filter(d=>!DEF_GROUPS.some(g=>g.ids.includes(d.id)));return fora.length?`<div class="defgrp"><span class="defgrp-h">Outros</span><div class="defchips">${fora.map(d=>`<label class="chip ${C.defs.includes(d.id)?"on":""}"><input type="checkbox" data-cdef="${d.id}" ${C.defs.includes(d.id)?"checked":""}>${esc(d.nome)}</label>`).join("")}</div></div>`:""})()}</div>
   <div class="card"><p class="sec-title">2 · Como confirmar (evidências)</p><p class="muted small" style="margin-bottom:10px">O que verificar para saber se foi esta a causa, e onde está o registro. Aparece na árvore de falha.</p>
    ${C.evid.map((e,ix)=>`<div class="evrow"><input data-ev="${ix}" data-ek="0" value="${esc(e[0]||"")}" placeholder="O que verificar"><input data-ev="${ix}" data-ek="1" value="${esc(e[1]||"")}" placeholder="Onde (registro, setor, tela)"><button class="iconbtn" data-evdel="${ix}" aria-label="Remover evidência" title="Remover">✕</button></div>`).join("")}
    <button class="btn sm" id="evAdd" style="margin-top:8px">+ Evidência</button></div>
   <div class="card"><p class="sec-title">3 · Ação e reação</p><div class="grid g2">
    <label class="f">Reação imediata (contenção)<textarea id="c_reacao" placeholder="${esc(REACT[C.st]||REACT.MOLD)}">${esc(C.reacao||"")}</textarea><span class="hint">Em branco, vale a reação padrão da etapa (FS 342 / PR 8.7), mostrada acima em cinza.</span></label>

   <div class="card"><p class="sec-title">4 · Confiança na informação</p><div class="grid g2">
    <label class="f">Status da relação<select id="c_nat">${Object.entries(NAT).map(([k,l])=>`<option value="${k}" ${C.nat===k?"selected":""}>${l}</option>`).join("")}</select><span class="hint">Use “hipótese” enquanto a causa não foi confirmada na prática.</span></label>

  $$("[data-ev]").forEach(el=>el.oninput=()=>{C.evid[+el.dataset.ev][+el.dataset.ek]=el.value});

    await saveCause({...C,nome:C.nome.trim(),evid:C.evid.map(e=>[(e[0]||"").trim(),(e[1]||"").trim()]).filter(e=>e[0]),removida:false},isNew?"incluída":"alterada");
    toast(isNew?"Causa incluída na biblioteca.":"Causa salva.");sair()};
  if($("#cDel"))$("#cDel").onclick=async()=>{if(!confirm(`Remover a causa “${orig.nome}” da biblioteca?\n\nEla deixa de aparecer nas árvores novas. Pode ser restaurada depois, em “Causas removidas”.`))return;await saveCause({...orig,removida:true},"removida");toast("Causa removida.");sair()};

}

  }else if(ptab==="t1"){

  }else{
    h+=`<div class="card"><h2>Como o regime muda (NBR 5426, 5.3)</h2><p class="muted small" style="margin:2px 0 10px">Toda série (produto + ponto + NQA) começa no <b>Normal</b>. O sistema acompanha os lotes e muda o regime sozinho, seguindo as setas.</p><p class="hint onlym" style="margin:0 0 6px">Arraste o desenho para o lado para ver tudo.</p><div class="rgbox">${regimeDiagram()}</div>
     <div class="rglegend"><span><i style="background:var(--ok)"></i><b>Atenuada:</b> qualidade boa e estável, amostra menor (menos inspeção)</span><span><i style="background:var(--brand)"></i><b>Normal:</b> plano padrão</span><span><i style="background:var(--nc)"></i><b>Severa:</b> qualidade piorou, critério mais rigoroso</span></div></div>
     <div class="grid g2"><div class="card"><h2>Sistema de comutação (5.3)</h2><table class="t"><tbody>
     <tr><td><span class="pill brand">Normal</span> → <span class="pill nc">Severa</span></td><td>2 lotes rejeitados em 5 consecutivos (inspeção original).</td></tr>

     <tr><td><span class="pill nc">Severa</span> por 10 lotes</td><td>Interromper a inspeção pela norma até haver melhoria da qualidade (5.4).</td></tr></tbody></table>

/* =========================================================================
   12. DADOS E CONFIGURAÇÃO
   ========================================================================= */
function pgDados(){
  head("Referência","Dados e configuração");
  const c=cfg(),adm=colab?.papel==="admin";
  const stTxt={ok:"Conectado",offline:"Sem conexão (usando cópia local)",local:"Modo local, sem compartilhar",off:"Não configurado",login:"Aguardando login",negado:"E-mail não autorizado"}[cloudState];
  let h=`<div class="grid g2"><div class="card"><h2>Banco de dados compartilhado</h2>
   <dl class="list-kv"><dt>Situação</dt><dd><span class="pill ${cloudState==="ok"?"ok":"warn"}">${stTxt}</span></dd>${user?`<dt>Usuário</dt><dd>${esc(colab?.nome||"")} ${esc(user.email)} ${adm?'<span class="pill brand">administrador</span>':""}</dd>`:""}<dt>Registros</dt><dd>${S.inspecoes.length} inspeções · ${S.investigacoes.length} árvores · ${S.produtos.length} produto(s)</dd><dt>A enviar</dt><dd>${(S.meta.fila||[]).length} alteração(ões)</dd>${S.meta.lastSync?`<dt>Última sincronização</dt><dd>${new Date(S.meta.lastSync).toLocaleString("pt-BR")}</dd>`:""}</dl>
   <p class="muted small" style="margin:12px 0">Os registros ficam num banco na nuvem (Supabase) e aparecem para todos os colaboradores autorizados, em qualquer computador ou celular. Cada aparelho guarda uma cópia para continuar funcionando sem internet; as alterações são enviadas assim que a conexão volta.</p>
   <div class="row">${user?'<button class="btn" id="syncNow">Sincronizar agora</button><button class="btn" id="sairB">Sair</button>':""}${cloudState==="local"?'<button class="btn primary" id="sairLocal">Sair do modo local e entrar no banco</button>':""}</div>
   <details style="margin-top:14px" ${cloudConfigured()?"":"open"}><summary class="small" style="cursor:pointer;font-weight:600">Configuração técnica (TI)</summary>
   <div class="grid" style="margin-top:8px"><label class="f">URL do projeto Supabase<input id="cfUrl" value="${esc(c.url)}" placeholder="https://xxxx.supabase.co"></label><label class="f">Chave publicável<input id="cfKey" value="${esc(c.key)}" placeholder="sb_publishable_…"></label></div>
   <div class="row" style="margin-top:8px"><button class="btn sm" id="cfSave">Salvar e reconectar</button></div><p class="hint">Use apenas a chave publicável. Nunca coloque a chave secreta (service_role) neste arquivo.</p></details></div>
   <div class="card"><h2>Backup e exportação</h2><p class="muted small" style="margin-bottom:12px">O backup em JSON guarda todo o banco e pode ser importado em outro computador (os registros são mesclados, sem duplicar). Os CSV abrem no Excel.</p>
   <div class="row"><button class="btn primary" id="bk">Baixar backup (JSON)</button><button class="btn" id="imp">Importar backup</button><input type="file" id="impF" accept=".json,application/json" hidden></div>
   <div class="row" style="margin-top:10px"><button class="btn" data-x="I">CSV inspeções</button><button class="btn" data-x="V">CSV árvores de falha</button><button class="btn" data-x="B">CSV biblioteca</button></div></div></div>`;
  if(adm&&cloudState==="ok")h+=`<div class="card"><h2>Inspeções excluídas</h2><p class="muted small" style="margin-bottom:10px">Toda exclusão fica guardada no banco com o motivo e o usuário. Se uma inspeção foi excluída por engano, restaure aqui: ela volta para todos, junto com as árvores de falha.</p><div id="lixo"><button class="btn sm" id="lixoLoad">Ver inspeções excluídas</button></div></div>`;
  h+=`<div class="card"><h2>Produtos, máquinas e usuários</h2><p class="muted small" style="margin-bottom:10px">Cadastro de produtos (com a FTP e as pré-definições de amostragem), máquinas e, para administradores, usuários e pedidos de acesso.</p><button class="btn" id="toCad2">Abrir Cadastros</button></div>`;
  h+=`<div class="grid g2"><div class="card"><h2>Demonstração</h2><p class="muted small" style="margin-bottom:12px">Gera lotes e árvores de falha fictícios, sorteados a partir dos produtos, das pré-definições e das máquinas cadastradas. Cada clique acrescenta cerca de um mês de histórico, anterior ao que já existe, como se o sistema estivesse em uso há mais tempo.</p><p class="small" style="margin-bottom:10px"><span class="pill ok">Só neste aparelho</span> Os dados DEMO não são enviados ao banco e não entram na contagem de regime das inspeções reais. Ao remover, somem por completo.${S.inspecoes.some(x=>x.demo)?` <b>${S.inspecoes.filter(x=>x.demo).length} lotes e ${S.investigacoes.filter(x=>x.demo).length} árvores DEMO carregados.</b>`:""}</p><div class="row"><button class="btn" id="demoOn">${S.inspecoes.some(x=>x.demo)?"Gerar mais um mês de demonstração":"Carregar demonstração"}</button><button class="btn danger" id="demoOff" ${S.inspecoes.some(x=>x.demo)?"":"disabled"}>Remover dados DEMO</button></div></div>
   <div class="card"><h2>Zona de risco</h2><p class="muted small" style="margin-bottom:12px">${cloudState==="ok"?"Apaga apenas a cópia guardada neste aparelho; o banco compartilhado não é alterado e é baixado de novo.":"Apaga todas as inspeções e árvores deste aparelho. Baixe um backup antes."}</p><button class="btn danger" id="wipe">Limpar dados deste aparelho</button></div></div>
   <div class="card"><h2>Sobre o sistema</h2><p class="small muted">Desenvolvido pelo Grupo 2 (Gestão de Processos e Qualidade) para a JSP Brasil. Amostragem simples por atributos conforme NBR 5426 (Tabelas 1 a 4 e 17; regras de comutação 5.3). Defeitos conforme FS 070 rev. 06/07 e Plano de Controle 64993-BZ100; reação conforme FS 342 / PR 8.7. As relações de causa e efeito marcadas como hipótese devem ser validadas pela Engenharia de Processos antes do uso como padrão. Arquivo único; o banco compartilhado é o Supabase da JSP e cada aparelho mantém uma cópia para uso sem internet.</p></div>`;
  setPage(h);
  if($("#syncNow"))$("#syncNow").onclick=async()=>{await flushQueue();await pullCloud(true);toast("Sincronizado.");pgDados()};
  if($("#sairB"))$("#sairB").onclick=signOut;
  if($("#sairLocal"))$("#sairLocal").onclick=()=>{try{sessionStorage.removeItem("jsp-modo-local")}catch(e){}location.reload()};
  $("#cfSave").onclick=async()=>{await setMeta("cloudUrl",$("#cfUrl").value.trim());await setMeta("cloudKey",$("#cfKey").value.trim());await setMeta("lastPull",null);location.reload()};
  $("#toCad2").onclick=()=>go("cadastros");
  if($("#lixoLoad")){const loadLixo=async()=>{const el=$("#lixo");el.innerHTML='<span class="muted small">Carregando…</span>';
      const {data,error}=await sb.from("inspecoes").select("id,dados,atualizado_em,atualizado_por").eq("excluido",true).order("atualizado_em",{ascending:false}).limit(100);
      if(error){el.innerHTML='<span class="small" style="color:var(--nc)">Não foi possível carregar.</span>';return}
      const L=(data||[]).filter(r=>r.dados&&r.dados.id);
      if(!L.length){el.innerHTML='<span class="muted small">Nenhuma inspeção excluída.</span>';return}
      el.innerHTML=`<div class="tw"><table class="t"><thead><tr><th>Lote</th><th>Data do lote</th><th>Ponto</th><th>Resultado</th><th>Excluída em</th><th>Por</th><th>Motivo</th><th></th></tr></thead><tbody>${L.map((r,i)=>{const x=r.dados;return `<tr><td><b>${esc(x.lote||"—")}</b></td><td>${fmtD(x.data)}</td><td>${esc(POINTS[x.ponto]?.nome||"")}</td><td>${resPill(x.result)}</td><td>${new Date(x.excluidoEm||r.atualizado_em).toLocaleString("pt-BR")}</td><td class="small">${esc(x.excluidoPor||r.atualizado_por||"")}</td><td class="small">${esc(x.excluidoMotivo||"—")}</td><td><button class="btn sm" data-rest="${i}">Restaurar</button></td></tr>`}).join("")}</tbody></table></div>`;
      $$("[data-rest]").forEach(b=>b.onclick=async()=>{const x={...L[+b.dataset.rest].dados};if(!confirm("Restaurar a inspeção do lote "+(x.lote||"")+"?"))return;b.disabled=true;
        const limpa=o=>{const c={...o};delete c.excluidoEm;delete c.excluidoPor;delete c.excluidoMotivo;return c};
        try{const {data:vs}=await sb.from("investigacoes").select("id,dados").eq("excluido",true).eq("dados->>inspecaoId",x.id);
          await persist("inspecoes",limpa(x));for(const v of (vs||[]))if(v.dados&&v.dados.id)await persist("investigacoes",limpa(v.dados));
          toast("Inspeção restaurada.");loadLixo()}catch(e){toast("Não foi possível restaurar.");b.disabled=false}})};
    $("#lixoLoad").onclick=loadLixo}
  $("#bk").onclick=()=>download(`JSP_backup_${today()}.json`,JSON.stringify(snapshot(),null,1),"application/json");
  $("#imp").onclick=()=>$("#impF").click();
  $("#impF").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.inspecoes)throw 0;const n=await mergeIn(j);toast(n+" registro(s) importado(s).");render()}catch(err){alert("Arquivo inválido: use um backup exportado por este sistema.")}};
  $$("[data-x]").forEach(b=>b.onclick=()=>{const k=b.dataset.x;if(k==="I"){go("inspecoes");setTimeout(()=>$("#exI").click(),50)}else if(k==="V"){go("investigacoes");setTimeout(()=>$("#exV").click(),50)}else{go("biblioteca");setTimeout(()=>$("#exB").click(),50)}});
  $("#demoOn").onclick=loadDemo;
  $("#demoOff").onclick=async()=>{const n=S.inspecoes.filter(x=>x.demo).length;if(!confirm(`Remover os ${n} lotes DEMO e as árvores deles? Eles somem por completo.`))return;
    for(const v of S.investigacoes.filter(v=>v.demo))await delLocal("investigacoes",v.id);for(const x of S.inspecoes.filter(x=>x.demo))await delLocal("inspecoes",x.id);
    const f=(S.meta.fila||[]).filter(q=>S[q.store]?.some(r=>r.id===q.id)||q.del);if(f.length!==(S.meta.fila||[]).length)await setMeta("fila",f);
    if(draft?.demo)draft=null;toast("Dados DEMO removidos.");render()};
  $("#wipe").onclick=async()=>{if(!confirm(cloudState==="ok"?"Limpar a cópia deste aparelho e baixar de novo do banco?":"Apagar TODAS as inspeções e árvores deste aparelho?"))return;if(cloudState!=="ok"&&prompt('Digite APAGAR para confirmar')!=="APAGAR")return;for(const v of [...S.investigacoes])await delLocal("investigacoes",v.id);for(const x of [...S.inspecoes])await delLocal("inspecoes",x.id);await setMeta("lastPull",null);if(cloudState==="ok")await pullCloud(true);toast("Dados deste aparelho limpos.");render()};
}
/* =========================================================================
   CADASTROS: produtos (com FTP), máquinas e usuários
   ========================================================================= */
let cadTab="produtos",maqEdit=null,pdraft=null;
function pgCadastros(){
  const adm=colab?.papel==="admin"&&cloudState==="ok";if(cadTab==="usuarios"&&!adm)cadTab="produtos";
  const ed=isAdmin();
  head("Referência","Cadastros",cadTab==="produtos"&&ed?`<button class="btn primary" id="newP">+ Novo produto</button>`:"");
  let h=`<div class="tabs" style="margin-bottom:14px"><button data-ct="produtos" aria-selected="${cadTab==="produtos"}">Produtos <span class="muted">(${S.produtos.length})</span></button><button data-ct="maquinas" aria-selected="${cadTab==="maquinas"}">Máquinas <span class="muted">(${S.maquinas.length})</span></button>${adm?`<button data-ct="usuarios" aria-selected="${cadTab==="usuarios"}">Usuários${pendentes.length?` <span class="nbadge" style="position:static;margin-left:4px">${pendentes.length}</span>`:""}</button>`:""}</div>`;
  if(!ed)h+=`<div class="banner info"><span>Você pode consultar os cadastros. Somente administradores incluem, alteram ou excluem produtos e máquinas.</span></div>`;
  if(cadTab==="produtos"){
    h+=S.produtos.length?`<div class="cadlist">${[...S.produtos].sort((a,b)=>(b.ref?1:0)-(a.ref?1:0)||a.id.localeCompare(b.id)).map(p=>{const ps=p.ftp?.params||[],fill=ps.filter(q=>q.nom||q.min||q.max).length,ninsp=S.inspecoes.filter(x=>x.productId===p.id).length;
      return `<div class="caditem"><div class="cadmain"><b>${esc(p.id)} · ${esc(p.nome)}</b>${p.ref?' <span class="pill brand">Referência</span>':""}<div class="small muted">${esc([p.cliente,p.codCliente].filter(Boolean).join(" · ")||"Cliente não informado")} · Máquina: ${esc(p.maquina||"—")}</div><div class="small" style="margin-top:4px"><span class="pill ${fill?"":"warn"}">FTP: ${fill} de ${ps.length} parâmetros preenchidos</span> <span class="pill">${ninsp} inspeção(ões)</span></div></div>
        <div class="cadact"><button class="btn sm" data-edp="${esc(p.id)}">${ed?"Editar":"Ver FTP e pré-definições"}</button>${ed?`<button class="btn sm danger" data-delp="${esc(p.id)}">Excluir</button>`:""}</div></div>`}).join("")}</div>`:`<div class="card"><p class="muted">Nenhum produto cadastrado.</p></div>`;
  }else if(cadTab==="maquinas"){
    const m=maqEdit?S.maquinas.find(x=>x.id===maqEdit):null;
    if(ed)h+=`<div class="card"><h2>${m?"Editar máquina":"Cadastrar máquina"}</h2><div class="grid g3" style="margin-top:8px"><label class="f">Identificação <span class="req">*</span><input id="mq_cod" value="${esc(m?.codigo||"")}" placeholder="Ex.: K1014 10"></label><label class="f">Tipo / modelo<input id="mq_tipo" value="${esc(m?.tipo||"")}" placeholder="Ex.: Moldadora K1014"></label><label class="f">Descrição / observação<input id="mq_desc" value="${esc(m?.descricao||"")}"></label></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="mq_save">${m?"Salvar alterações":"Adicionar máquina"}</button>${m?'<button class="btn" id="mq_canc">Cancelar</button>':""}</div></div>`;
    const L=[...S.maquinas].sort((a,b)=>a.codigo.localeCompare(b.codigo,"pt-BR",{numeric:true}));
    h+=L.length?`<div class="cadlist">${L.map(q=>{const np=S.produtos.filter(p=>p.maquina===q.codigo).length,ni=S.inspecoes.filter(x=>x.maquina===q.codigo).length;
      return `<div class="caditem"><div class="cadmain"><b>${esc(q.codigo)}</b>${q.tipo?` <span class="muted">· ${esc(q.tipo)}</span>`:""}${q.descricao?`<div class="small muted">${esc(q.descricao)}</div>`:""}<div class="small" style="margin-top:4px"><span class="pill">${np} produto(s)</span> <span class="pill">${ni} inspeção(ões)</span></div></div>
        ${ed?`<div class="cadact"><button class="btn sm" data-edm="${q.id}">Editar</button><button class="btn sm danger" data-delm="${q.id}">Excluir</button></div>`:""}</div>`}).join("")}</div>`:`<div class="card"><p class="muted">Nenhuma máquina cadastrada.</p></div>`;
  }else{
    h+=`<div class="card" id="filaCard"><h2>Pedidos de acesso</h2><p class="muted small" style="margin-bottom:10px">Quem cria uma conta pela tela de entrada aparece aqui. Aceite escolhendo o papel ou recuse. Recusados ficam na lista abaixo como bloqueados e podem ser liberados ou excluídos depois.</p><div id="filaList" class="muted small">Carregando…</div></div>
    <div class="card"><h2>Usuários</h2><p class="muted small" style="margin-bottom:10px">Só os e-mails liberados desta lista conseguem ver e registrar dados. “Excluir” apaga a conta de acesso; as inspeções que a pessoa registrou continuam guardadas. Também dá para cadastrar um e-mail antes de a pessoa criar a conta.</p><div id="colabList" class="muted small">Carregando…</div>
    <div class="grid g4" style="margin-top:12px;grid-template-columns:2fr 2fr 1fr auto"><label class="f">E-mail<input id="cbEmail" type="email"></label><label class="f">Nome<input id="cbNome"></label><label class="f">Papel<select id="cbPapel"><option value="inspetor">Inspetor(a)</option><option value="admin">Administrador</option></select></label><div style="align-self:end"><button class="btn primary" id="cbAdd">Incluir</button></div></div></div>`;
  }
  setPage(h);
  $$("[data-ct]").forEach(b=>b.onclick=()=>{cadTab=b.dataset.ct;maqEdit=null;pgCadastros()});
  if($("#newP"))$("#newP").onclick=()=>{pdraft=null;go("produto","novo")};
  $$("[data-edp]").forEach(b=>b.onclick=()=>{pdraft=null;go("produto",b.dataset.edp)});
  $$("[data-delp]").forEach(b=>b.onclick=()=>delProduto(b.dataset.delp));
  $$("[data-edm]").forEach(b=>b.onclick=()=>{maqEdit=b.dataset.edm;pgCadastros();window.scrollTo(0,0)});
  $$("[data-delm]").forEach(b=>b.onclick=async()=>{const q=S.maquinas.find(x=>x.id===b.dataset.delm);const np=S.produtos.filter(p=>p.maquina===q.codigo);
    if(!confirm(`Excluir a máquina ${q.codigo}?`+(np.length?`\n\n${np.length} produto(s) usam esta máquina como padrão e ficarão sem máquina padrão.`:"")+"\n\nAs inspeções já registradas mantêm a máquina informada."))return;
    for(const p of np){p.maquina="";await persist("produtos",p)}await remove("maquinas",q.id);if(maqEdit===q.id)maqEdit=null;toast("Máquina excluída.");pgCadastros()});
  if($("#mq_canc"))$("#mq_canc").onclick=()=>{maqEdit=null;pgCadastros()};
  if($("#mq_save"))$("#mq_save").onclick=async()=>{const cod=$("#mq_cod").value.trim();if(!cod){toast("Informe a identificação da máquina.");return}
    if(S.maquinas.some(x=>x.codigo.toLowerCase()===cod.toLowerCase()&&x.id!==maqEdit)){toast("Já existe uma máquina com essa identificação.");return}
    const old=maqEdit?S.maquinas.find(x=>x.id===maqEdit):null;const rec={...(old||{id:uid()}),codigo:cod,tipo:$("#mq_tipo").value.trim(),descricao:$("#mq_desc").value.trim()};
    if(old&&old.codigo!==cod)for(const p of S.produtos.filter(p=>p.maquina===old.codigo)){p.maquina=cod;await persist("produtos",p)}
    await persist("maquinas",rec);toast(old?"Máquina atualizada.":"Máquina cadastrada.");maqEdit=null;pgCadastros()};
  if(cadTab==="usuarios"&&adm){
    {const loadC=async()=>{const {data,error}=await sb.from("colaboradores").select("*").order("nome");if(error){$("#colabList").textContent="Não foi possível carregar.";return}
      $("#colabList").innerHTML=`<div class="tw"><table class="t"><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Acesso</th></tr></thead><tbody>${data.map(c=>`<tr><td>${esc(c.nome||"")}</td><td>${esc(c.email)}</td><td>${c.papel==="admin"?"Administrador":"Inspetor(a)"}</td><td>${c.email===user.email?'<span class="muted">você</span>':`<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-cbt="${esc(c.email)}" data-on="${c.ativo?0:1}">${c.ativo?"Bloquear":"Liberar"}</button><button class="btn sm danger" data-cbdel="${esc(c.email)}">Excluir</button></div>`}</td></tr>`).join("")}</tbody></table></div>`;
      $$("[data-cbt]").forEach(b=>b.onclick=async()=>{await sb.from("colaboradores").update({ativo:b.dataset.on==="1"}).eq("email",b.dataset.cbt);loadC()});
      $$("[data-cbdel]").forEach(b=>b.onclick=async()=>{const e=b.dataset.cbdel;if(!confirm("Excluir o usuário "+e+"?\n\nA conta de acesso é apagada e a pessoa sai da lista. As inspeções que ela registrou continuam guardadas."))return;
        const {error}=await sb.rpc("excluir_usuario",{p_email:e});if(error){toast("Não foi possível excluir: "+error.message);return}toast("Usuário excluído.");loadC();loadF()})};
    const loadF=async()=>{await loadPendentes();renderNav();const el=$("#filaList");if(!el)return;
      if(!pendentes.length){el.innerHTML='<span class="muted">Nenhum pedido aguardando.</span>';return}
      el.innerHTML=`<div class="fila">${pendentes.map((p,i)=>`<div class="filarow"><div class="filainfo"><b>${esc(p.email)}</b><span class="small muted">Pedido em ${new Date(p.criado_em).toLocaleString("pt-BR")} · ${p.confirmado?'<span style="color:var(--ok)">e-mail confirmado</span>':'<span style="color:var(--warn)">e-mail ainda não confirmado</span>'}</span></div><div class="filaact"><input data-fnome="${i}" placeholder="Nome (opcional)"><select data-fpapel="${i}"><option value="inspetor">Inspetor(a)</option><option value="admin">Administrador</option></select><button class="btn sm primary" data-faceitar="${i}">Aceitar</button><button class="btn sm danger" data-frecusar="${i}">Recusar</button></div></div>`).join("")}</div>`;
      const act=async(i,ativo)=>{const p=pendentes[i];if(!ativo&&!confirm("Recusar o acesso de "+p.email+"?"))return;const {error}=await sb.from("colaboradores").upsert({email:p.email,nome:($(`[data-fnome="${i}"]`)?.value||"").trim()||null,papel:ativo?$(`[data-fpapel="${i}"]`).value:"inspetor",ativo});if(error){toast("Não foi possível salvar: "+error.message);return}toast(ativo?"Acesso liberado para "+p.email+".":"Pedido recusado.");loadF();loadC()};
      $$("[data-faceitar]").forEach(b=>b.onclick=()=>act(+b.dataset.faceitar,true));$$("[data-frecusar]").forEach(b=>b.onclick=()=>act(+b.dataset.frecusar,false))};
    loadF();loadC();$("#cbAdd").onclick=async()=>{const email=$("#cbEmail").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email)){toast("Informe um e-mail válido.");return}const {error}=await sb.from("colaboradores").upsert({email,nome:$("#cbNome").value.trim(),papel:$("#cbPapel").value,ativo:true});if(error){toast("Não foi possível incluir: "+error.message);return}$("#cbEmail").value="";$("#cbNome").value="";toast("Colaborador incluído.");loadC()}}

  }
}
async function delProduto(id){const p=prod(id);if(!p)return;const ni=S.inspecoes.filter(x=>x.productId===id).length;
  if(!confirm(`Excluir o produto ${p.id} · ${p.nome}?`+(ni?`\n\nAs ${ni} inspeção(ões) já registradas deste produto continuam guardadas no histórico.`:"")+"\n\nA FTP e as pré-definições deste produto serão apagadas."))return;
  await remove("produtos",id);if(draft?.productId===id)draft=null;toast("Produto excluído.");cadTab="produtos";go("cadastros")}
function pgProduto(){
  const isNew=route.id==="novo",orig=isNew?null:prod(route.id);if((!isNew&&!orig)||(isNew&&!isAdmin())){go("cadastros");return}
  const ed=isAdmin();

// Demonstração: lotes fictícios sorteados a partir dos cadastros (produtos, pré-definições e máquinas).
// Cada clique acrescenta cerca de um mês de histórico, anterior ao que já existe. Fica só neste aparelho.
async function loadDemo(){
  if(!S.produtos.length){toast("Cadastre um produto antes de gerar a demonstração.");return}
  const b=$("#demoOn");if(b){b.disabled=true;b.textContent="Gerando…"}
  const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],chance=p=>Math.random()<p;
  const wpick=pairs=>{let t=pairs.reduce((a,x)=>a+x[1],0),r=Math.random()*t;for(const [v,w] of pairs){r-=w;if(r<=0)return v}return pairs[0][0]};
  const binom=(n,p)=>{let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k};
  const iso=dt=>new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const demos=S.inspecoes.filter(x=>x.demo),DIAS=30;
  const fim=demos.length?new Date(demos.map(x=>x.data).sort()[0]+"T12:00:00"):new Date();if(demos.length)fim.setDate(fim.getDate()-1);
  const nomes=["Ana (DEMO)","Bruno (DEMO)","Carla (DEMO)","Diego (DEMO)"],turnos=["1º","2º","3º"],maqs=S.maquinas.map(m=>m.codigo);
  const pesoDef={rebarba:6,esfarelamento:3,falha_injecao:3,murcha:2,inchaco:3,corte:3,deformada:2,peso_umido:2,peso_seco:2,dimensional:2};
  const novos=[];
  for(let dia=DIAS-1;dia>=0;dia--){
    const dt=new Date(fim);dt.setDate(dt.getDate()-dia);if(dt.getDay()===0)continue;
    const qtd=dt.getDay()===6?rnd(2):1+rnd(3);
    for(let q=0;q<qtd;q++){
      const p=pick(S.produtos),ponto=wpick([["FL",5],["MOLD",3],["EST",2]]),ps=presetOf(p,ponto);
      const N=ps.N??pick([150,280,300,480,500,520,800,1200]),nivel=ps.nivel||"II",nqa=ps.nqa??10;
      const maquina=p.maquina&&chance(.7)?p.maquina:(maqs.length?pick(maqs):p.maquina||"");
      novos.push({id:uid(),createdAt:dt.getTime()+q*3600e3+rnd(3000e3),productId:p.id,produto:p.nome,ponto,data:iso(dt),turno:pick(turnos),maquina,molde:"",op:"DEMO-"+(1000+rnd(9000)),lote:"DEMO-"+iso(dt).slice(5).replace("-","")+"-"+(q+1),inspetor:pick(nomes),N,nivel,nqa,
        _frac:(parseFloat(String(NQA[nqa]).replace(",","."))/100)*(chance(.18)?3+Math.random()*4:.2+Math.random()*.9),obs:"Registro fictício para demonstração.",reap:false,reacao:{},demo:true});
    }
  }
  novos.forEach(x=>S.inspecoes.push(x));
  // percorre todo o histórico DEMO em ordem de data para o regime (normal/severa/atenuada) ficar coerente
  const todos=S.inspecoes.filter(x=>x.demo&&!x.reap).sort(byTime);todos.forEach(x=>{if(novos.includes(x))x.result=null});
  for(const x of todos){
    const p=prod(x.productId),rs=regimeState(x.productId,x.ponto,x.nqa,x.id,true,x),pl=samplingPlan(x.N,x.nivel,x.nqa,rs.reg);if(!pl){x.result="A";continue}
    const novo=novos.includes(x);
    if(novo){const defs=DEFECTS.filter(d=>d.pts.includes(x.ponto)).map(d=>[d.id,pesoDef[d.id]||1]);const d=Math.min(pl.n,binom(pl.n,x._frac));x.pecas=[];
      for(let i=0;i<d;i++){const k=wpick(defs),pc={n:i+1,def:[k],cav:""};if(chance(.15)){const k2=wpick(defs);if(k2!==k)pc.def.push(k2)}
        pc.def.forEach(k=>{if(WEIGHT_DEFS.includes(k)){const f=ftpParam(p,k),mx=numIn(f?.max),mn=numIn(f?.min);if(mx!=null&&mn!=null){const v=chance(.5)?mx*(1.01+Math.random()*.04):mn*(.95+Math.random()*.04);(pc.med=pc.med||{})[k]=v.toFixed(3).replace(".",",")}}});x.pecas.push(pc)}
      delete x._frac}
    else if((x.pecas||[]).length>pl.n)x.pecas=x.pecas.slice(0,pl.n);
    const d=(x.pecas||[]).length,defeitos={};x.pecas.forEach(pc=>pc.def.forEach(k=>defeitos[k]=(defeitos[k]||0)+1));
    const mudou=novo||x.regime!==rs.reg||x.n!==pl.n||x.ac!==pl.ac||x.re!==pl.re;
    Object.assign(x,{regime:rs.reg,letra0:pl.letter0,letra:pl.letter,n:pl.n,ac:pl.ac,re:pl.re,inspecao100:pl.full,d,defeitos,result:d<=pl.ac?"A":d>=pl.re?"R":"AR"});
    if(mudou)await persist("inspecoes",x);
  }
  // árvores de falha: lotes rejeitados sempre; aceitos com falha, às vezes
  for(const x of novos){const tipos=Object.keys(x.defeitos||{});if(!tipos.length||(x.result!=="R"&&!chance(.35)))continue;
    for(const k of tipos.slice(0,2)){const v=await createInvestigation(x,k);v.createdAt=x.createdAt+1;const est=wpick([["concluida",4],["andamento",3],["aberta",3]]);
      if(est!=="aberta"){v.presenca=x.ponto==="FL"?{fl:"S",est:"S"}:x.ponto==="EST"?{est:"S"}:{};const cs=CAUSES.filter(c=>c.defs.includes(k)&&stageActive(v,c.st));
        if(cs.length){const c=pick(cs);v.respostas={[c.id]:{a:"S",note:"Desvio fictício para demonstração."}};cs.filter(o=>o!==c).slice(0,2).forEach(o=>v.respostas[o.id]={a:"N"});
          v.conclusao=est==="concluida"?{status:"concluida",classif:"confirmada",resp:c.resp+" (DEMO)",prazo:x.data,contencao:"Lote segregado e inspecionado 100% (fictício).",correcao:c.acao,eficacia:c.efic}:{status:"andamento",classif:"provavel",resp:c.resp+" (DEMO)"}}}
      await persist("investigacoes",v)}}
  toast(`${novos.length} lotes fictícios gerados${demos.length?" (histórico acumulado: "+(demos.length+novos.length)+")":""}.`);go("painel");
}

    if(cloudState==="ok"){await flushQueue();const np=pendentes.length;await loadPendentes();if(np!==pendentes.length)pullCloud.mudou=true;if(++_tick%15===0)await recheckAccess()}
    if(pullCloud.mudou&&!["nova","arvore","produto","causa"].includes(route.p)&&!digitando()){pullCloud.mudou=false;const y=window.scrollY;render();window.scrollTo(0,y)}else{renderNav();updateDbStatus()}}},20000);
  window.addEventListener("online",()=>{if(cloudState==="offline")pullCloud(false).then(()=>updateDbStatus())});
  try{navigator.storage?.persist?.()}catch(e){}
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&(cloudState==="ok"||cloudState==="offline"))pullCloud(false).then(()=>{if(pullCloud.mudou&&!["nova","arvore","produto","causa"].includes(route.p)&&!digitando()){pullCloud.mudou=false;render()}else updateDbStatus()})});
})();
</script>
