# Varredura do site publicado (OWASP ZAP, modo "baseline": só observa, não ataca).
# Roda toda quarta-feira. O relatório fica em Actions > (execução) > Artifacts.
# Alertas que o GitHub Pages não permite corrigir (cabeçalhos HTTP) estão marcados
# como aceitos em .zap/rules.tsv. A execução não fica vermelha por alerta e não abre issues,
# para não expor detalhes num repositório público.
name: "Segurança: varredura do site"

on:
  schedule:
    - cron: "07 12 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://jsp-qualidade.github.io/"
          rules_file_name: ".zap/rules.tsv"
          fail_action: false
          allow_issue_writing: false
          artifact_name: relatorio-zap
