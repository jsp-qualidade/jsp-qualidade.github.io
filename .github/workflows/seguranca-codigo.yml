# Análise estática do código (CodeQL): procura padrões vulneráveis no JavaScript do index.html
# (por exemplo, texto do banco indo para a página sem escape) e nos próprios workflows.
# Os alertas aparecem em Security > Code scanning.
name: "Segurança: análise do código"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
